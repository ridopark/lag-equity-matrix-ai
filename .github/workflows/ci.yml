name: ci

# The synthetic baseline guard (D-52) freezes verdicts that depend on
# floating-point reduction order in correlation and rolling-std maths. That was
# verified stable across BLAS thread counts on x86_64, but a different
# architecture pairs a different BLAS kernel with different SIMD widths, and a
# near-tie in the topk neighbour ranking could resolve the other way. Running
# the suite on both architectures is what turns that from an assumption into an
# observation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Confirm the runner really is ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" \
            || { echo "expected ${{ matrix.arch }}, got $(uname -m)"; exit 1; }
          uv run python -c "import numpy; numpy.show_config()"

      - run: uv run ruff check

      # Four tests cannot run here and skip, by design, not by accident:
      #   test_serve_source.py           needs data/bars-10y.parquet
      #   test_serve_default_as_of_*.py  needs data/bars*.parquet   (x2)
      #   test_vector_index_embedding.py needs tests/fixtures/embedding-reference.json
      # All four are vendor or corpus data deliberately kept out of a public
      # repo. `require_local_file` skips them when absent and FAILS them under
      # LAGMATRIX_REQUIRE_LIVE=1, so a machine that is supposed to have the
      # data cannot quietly skip instead (Q-43). Naming them here so the skip
      # count is a stated expectation rather than something nobody reads.
      - run: uv run pytest -q

      - name: Baseline guard, synthetic universe
        run: uv run python scripts/check_baseline.py --synthetic

      - name: Golden file is byte-reproducible on this architecture
        run: |
          uv run python scripts/capture_baseline.py --synthetic --out /tmp/regen.csv
          diff -u tests/fixtures/synthetic-baseline.csv /tmp/regen.csv \
            && echo "identical on $(uname -m)"
