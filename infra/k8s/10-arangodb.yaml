# ArangoDB — the graph store D-02/D-13 chose and D-16 accidentally made
# unnecessary. Now it has something genuinely graph-shaped to hold: a directed,
# dated supply-chain graph and a PMI-weighted co-mention graph.
#
# Its own namespace, and modest limits because the homelab node is shared.
#
# CORRECTION (2026-09-10): the namespace claim above was wrong and is left here
# rather than deleted, because it is the kind of sentence that gets trusted.
# There is no NetworkPolicy in this cluster -- `kubectl get networkpolicy -A`
# returns nothing -- and Kubernetes defaults to allow-all in both directions.
# A namespace partitions names, not traffic: a pod here can reach the trading
# workloads today. A default-deny NetworkPolicy is what would make the sentence
# true, and it does not exist yet.
#
# The "~4 GB headroom" figure was also wrong: it measured *requests*, which is
# not what gets a pod killed. The node's limits already sum to ~115% of
# capacity.
apiVersion: v1
kind: Namespace
metadata:
  name: lagmatrix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arangodb-data
  namespace: lagmatrix
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arangodb
  namespace: lagmatrix
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a rolling update
  # starts the new pod while the old one still holds /var/lib/arangodb3/LOCK and
  # the new one dies with "database is locked by process 1".
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: arangodb}
  template:
    metadata:
      labels: {app: arangodb}
    spec:
      containers:
        - name: arangodb
          image: arangodb:3.12
          # --experimental-vector-index turns on the HNSW vector index. Without
          # it ArangoDB serves the graph but only brute-force COSINE_SIMILARITY
          # in AQL, which is not a vector database in any meaningful sense.
          # Enabling it lets one store fill both roles, which is what D-13 chose
          # and what the node's memory headroom requires.
          args: ["arangod", "--experimental-vector-index"]
          env:
            - name: ARANGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: arangodb-auth, key: password}
          ports:
            - containerPort: 8529
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            # Raised 1500Mi -> 2560Mi on 2026-09-10 after 8 OOM-kills in two
            # days (exit 137). Measured at 942Mi at rest -- 63% of the old
            # ceiling before any load -- because the corpus grew to 47,829
            # embedded articles and 24,104 co-movement edges. Not node
            # pressure: the node had ~2.5GiB free.
            # This is a ceiling, not a fix. load_vectors.py rebuilds the whole
            # ANN index every run and the corpus grows daily, so incremental
            # indexing is the durable answer (Q-49).
            limits:   {memory: 2560Mi, cpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/arangodb3}
          readinessProbe:
            tcpSocket: {port: 8529}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: arangodb-data}
---
apiVersion: v1
kind: Service
metadata:
  name: arangodb
  namespace: lagmatrix
spec:
  selector: {app: arangodb}
  ports:
    - {port: 8529, targetPort: 8529}
