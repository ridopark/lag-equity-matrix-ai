# ArangoDB — the graph store D-02/D-13 chose and D-16 accidentally made
# unnecessary. Now it has something genuinely graph-shaped to hold: a directed,
# dated supply-chain graph and a PMI-weighted co-mention graph.
#
# Its own namespace, and modest limits because the homelab node is shared.
#
# CORRECTION (2026-09-10): the namespace claim above is wrong, and so was my
# first correction of it. Both are left here because these are exactly the
# sentences that get trusted later.
#
# I originally wrote that `kubectl get networkpolicy -A` returns nothing. I had
# not run it. It returns two policies, both in `copytrade`, both ingress-only:
# `exec-alpaca-live` and `exec-alpaca-paper` accept traffic only from
# `app=api-gateway` in their own namespace.
#
# Measured from a pod in THIS namespace on 2026-09-10 (busybox, `nc -z`, with a
# control target to prove the method worked -- the first attempt reported
# everything "blocked" because the arangodb image has no bash and the command
# never ran):
#
#     REACHABLE   postgres.copytrade:5432      <- the trading database
#     REACHABLE   redis.copytrade:6379
#     REACHABLE   api-gateway.copytrade:8082   <- broker-credential write routes
#     REACHABLE   dashboard.copytrade:3000
#     REACHABLE   market-data.copytrade:8080
#     blocked     exec-alpaca-live:8080        <- its NetworkPolicy works
#     blocked     orchestrator:8080            <- has an endpoint; unexplained
#     blocked     audit:8081                   <- 0 endpoints, proves nothing
#
# So the namespace does not isolate: a pod here reaches the trading system's
# postgres, its redis, and its api-gateway today. That is the same postgres
# D-103's injection would have reached. The two existing policies protect the
# execution pods specifically and nothing else. A default-deny egress policy in
# `lagmatrix` is what would make the header sentence true; it does not exist.
#
# The "~4 GB headroom" figure was also wrong: it measured *requests*, which is
# not what gets a pod killed. The node's limits already sum to ~115% of
# capacity.
apiVersion: v1
kind: Namespace
metadata:
  name: lagmatrix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arangodb-data
  namespace: lagmatrix
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arangodb
  namespace: lagmatrix
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a rolling update
  # starts the new pod while the old one still holds /var/lib/arangodb3/LOCK and
  # the new one dies with "database is locked by process 1".
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: arangodb}
  template:
    metadata:
      labels: {app: arangodb}
    spec:
      containers:
        - name: arangodb
          image: arangodb:3.12
          # --experimental-vector-index turns on the HNSW vector index. Without
          # it ArangoDB serves the graph but only brute-force COSINE_SIMILARITY
          # in AQL, which is not a vector database in any meaningful sense.
          # Enabling it lets one store fill both roles, which is what D-13 chose
          # and what the node's memory headroom requires.
          args: ["arangod", "--experimental-vector-index"]
          env:
            - name: ARANGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: arangodb-auth, key: password}
          ports:
            - containerPort: 8529
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            # Raised 1500Mi -> 2560Mi on 2026-09-10 after 8 OOM-kills in two
            # days (exit 137). Measured at 942Mi at rest -- 63% of the old
            # ceiling before any load -- because the corpus grew to 47,829
            # embedded articles and 24,104 co-movement edges. Not node
            # pressure: the node had ~2.5GiB free.
            # This is a ceiling, not a fix. load_vectors.py rebuilds the whole
            # ANN index every run and the corpus grows daily, so incremental
            # indexing is the durable answer (Q-49).
            limits:   {memory: 2560Mi, cpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/arangodb3}
          readinessProbe:
            tcpSocket: {port: 8529}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: arangodb-data}
---
apiVersion: v1
kind: Service
metadata:
  name: arangodb
  namespace: lagmatrix
spec:
  selector: {app: arangodb}
  ports:
    - {port: 8529, targetPort: 8529}
