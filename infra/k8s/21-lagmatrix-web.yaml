# The explorer UI. **ClusterIP only, deliberately — there is no Ingress here.**
#
# Reach it with:  kubectl -n lagmatrix port-forward svc/lagmatrix-web 8000:80
#
# serve.py has no authentication of any kind, and `audit-conventions` measured
# that this cluster has no Traefik middleware at all — no basicAuth, no
# forwardAuth, no ipAllowList — so "follow the existing Ingress convention"
# would publish it to the LAN unauthenticated. Adding an Ingress is a separate
# decision that needs auth first; deploying without one needs nothing.
#
# This is still strictly less privileged than running serve.py on a laptop,
# which is what it replaces: that process holds the ArangoDB **root** password.
# This one connects as `lagmatrix_ro` (`ro` on lagmatrix, `none` on _system,
# verified to be denied document insert, collection create and AQL write).
# Every ArangoDB call reachable from an HTTP request is an aql.execute read;
# the only writer, upsert_comovement, has one caller — the ingest CronJob,
# which keeps the root credential.
apiVersion: v1
kind: Service
metadata:
  name: lagmatrix-web
  namespace: lagmatrix
spec:
  type: ClusterIP
  selector: {app: lagmatrix-web}
  ports:
    - {name: http, port: 80, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lagmatrix-web
  namespace: lagmatrix
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data PVC is ReadWriteOnce, so a rolling
  # update would deadlock waiting for the old pod to release it.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lagmatrix-web}
  template:
    metadata:
      labels: {app: lagmatrix-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Kubernetes owns secret volumes root:root; without this a 0440 mount is
        # unreadable by uid 10001 and arango_db() reports "not reachable" for
        # what is actually a PermissionError (D-117, Q-55).
        fsGroup: 10001
      initContainers:
        # Q-58/D-126, now on the web pod too. kube-router programs a pod's
        # KUBE-POD-FW-* chain from a pod-add informer event, so egress is
        # unenforced for the first 1-3 seconds of a pod's life. The ingest is a
        # Job and got this guard first, on the reasoning that a Deployment
        # "starts once and lives" and is far less exposed.
        #
        # Two things overturn that for this pod. It uses `strategy: Recreate`,
        # so it is fully torn down and recreated on EVERY deploy -- including
        # the one shipping this -- hitting the window at a frequency closer to
        # the Job's than to "once". And as of this change it holds a live
        # database credential and genuine outbound internet access at the same
        # time, a larger blast radius during that window than it has ever had.
        # The guard travels with the pod's exposure, not its workload class.
        #
        # Probe targets are unchanged from the ingest's: the widened policy
        # gives this pod the same allow/except shape, so arangodb:8529 is still
        # a valid ALLOWED target and the LAN :6443 still a valid DENIED one.
        - name: await-netpol
          image: ghcr.io/ridopark/lag-equity-matrix-ai:589bf03
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket, sys, time
              DENIED = ("192.168.10.123", 6443)
              ALLOWED = ("arangodb", 8529)
              DEADLINE = 30.0
              def open_(t):
                  try:
                      socket.create_connection(t, timeout=2).close()
                      return True
                  except OSError:
                      return False
              t0 = time.time()
              while time.time() - t0 < DEADLINE:
                  denied_blocked = not open_(DENIED)
                  allowed_up = open_(ALLOWED)
                  if denied_blocked and allowed_up:
                      print("egress policy enforced after %.1fs" % (time.time() - t0), flush=True)
                      sys.exit(0)
                  time.sleep(0.25)
              sys.exit("egress policy not enforced after %.0fs "
                       "(denied_blocked=%s, allowed_up=%s); refusing to run"
                       % (DEADLINE, denied_blocked, allowed_up))
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}

        # The PVC mounts at /app/data and shadows whatever the image baked
        # there -- so data/excluded-etfs.csv, which IS committed and IS in
        # the image, was invisible and comovement died on it. This copies
        # the image's copy onto the volume before the run, which keeps the
        # repo as the source of truth rather than letting a seeded copy
        # drift. It mounts the volume at /seed precisely so /app/data stays
        # unshadowed here and the baked-in file can be read.

        # The PVC mounts at /app/data and shadows what the image baked there,
        # so the committed data/excluded-etfs.csv would be invisible —
        # neighbourhood() reads it. Same fix as the ingest CronJob.
        - name: seed-reference-data
          image: ghcr.io/ridopark/lag-equity-matrix-ai:589bf03
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -f /app/data/excluded-etfs.csv /seed/excluded-etfs.csv"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /seed}
      containers:
        - name: web
          image: ghcr.io/ridopark/lag-equity-matrix-ai:589bf03
          imagePullPolicy: IfNotPresent
          # --host 0.0.0.0 is required: serve.py defaults to 127.0.0.1, which
          # would leave the Service unable to reach the pod at all.
          args: ["scripts/serve.py", "--host", "0.0.0.0", "--port", "8000", "--allow-real"]
          env:
            - {name: LAGMATRIX_ARANGO_URL, value: "http://arangodb:8529"}
            - {name: LAGMATRIX_ARANGO_USER, value: "lagmatrix_ro"}
          # The web pod's first envFrom. `optional: true` is load-bearing:
          # without it, referencing a secret that does not yet exist leaves
          # this pod in CreateContainerConfigError and the demo stops serving
          # entirely -- to add a credential nothing can use yet. With it, the
          # page serves and reports `"llm": false` in its start event, exactly
          # as it already reports `"graphrag": false` without ArangoDB.
          # envFrom, not a volume mount, so D-117's fsGroup fix does not apply.
          envFrom:
            - secretRef: {name: anthropic-credentials, optional: true}
          ports:
            - {containerPort: 8000, name: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # /health is liveness only and touches no dependency (D-113): a probe
          # that fails when ArangoDB is down would get the pod killed for
          # something a restart cannot fix, and Q-49 says that outage is routine.
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          # /config carries the readiness-shaped signal non-fatally — it reports
          # graphrag: arango_db() is not None — but it calls default_as_of(),
          # which reads the ~650MiB co-movement frame (D-109). Probing it on a
          # short period would re-pay that; startup only.
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          # Measured, not estimated: 155.8 MiB at rest, 337.6 MiB after the
          # first /config, and COMOVE_CLOSES peaks near 1,018 MiB during the
          # pivot (D-109, D-115).
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {cpu: "1", memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
            - name: arango-pw
              mountPath: /home/appuser/.lagmatrix-arango-pw
              subPath: password
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: lagmatrix-data}
        - name: tmp
          emptyDir: {}
        - name: arango-pw
          secret:
            secretName: arangodb-auth-ro
            items: [{key: password, path: password}]
            defaultMode: 0440
