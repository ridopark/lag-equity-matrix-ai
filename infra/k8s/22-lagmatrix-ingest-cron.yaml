# NOT DEPLOYABLE AS WRITTEN. Every node fails. Read this before applying it.
#
# Measured by running the image, not by reading the manifest back:
#
#   node        blocker
#   ----------  ------------------------------------------------------------
#   bars        fetch_bars.py reads data/fires.csv -- private signal data,
#               deliberately in neither the repo nor the image
#   long_bars   fetch_daily_bars.py needs data/bars-10y.parquet to exist; on
#               an empty PVC it exits "seed it with fetch_history.py first"
#   news        load_news.py needs fires.csv AND writes to copytrade's
#               postgres through `kubectl -n copytrade exec -i postgres-0`
#   vectors     load_vectors.py needs fires.csv AND the same kubectl path,
#               plus a second one into deploy/arangodb
#   comovement  COMOVE_CLOSES() finds no bars-10y.parquet, so
#               session_available reports "not found in data" (D-110 doing
#               its job -- a loud failure, not a silent one)
#
# Two independent problems, both one-time rather than ongoing:
#
# 1. The PVC has to be seeded once with fires.csv, bars.parquet and
#    bars-10y.parquet. The ingest extends those files; it does not create them
#    from nothing. fires.csv is private data, so seeding is an out-of-band
#    operator step, not something CI can do.
#
# 2. load_news.py and load_vectors.py reach postgres by shelling out to
#    `kubectl exec`, which works from a laptop with a kubeconfig and cannot
#    work from a pod with no kubectl, no service-account token and a read-only
#    root filesystem. A direct postgres connection is the clean fix: they are
#    already piping SQL over a pipe, so it is a connection string and a Secret,
#    and it removes cluster credentials from a batch job that should not hold
#    them.
#
# What IS ready: the image builds at 725MB, runs, reports healthy, and carries
# no torch. These manifests pass `kubectl apply --dry-run=server`. And the
# pipeline itself is correct -- it ran end to end tonight on a machine that has
# the data, extending bars-10y to 2026-09-09, repairing two live splits, and
# writing 24,104 co-movement edges.
#
# The gap is not the code. It is that nothing has ever put this repo's data
# where a pod could see it.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: lagmatrix-ingest
  namespace: lagmatrix
spec:
  schedule: "0 9 * * 2-6"
  # A re-run must never race the previous one against the same parquet files.
  # D-97 makes concurrent upserts safe but not free, and Forbid is simpler than
  # reasoning about interleaved ones.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 20
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: ingest
              # :latest is a placeholder until CI publishes SHA tags. It is a
              # mutable pointer -- with imagePullPolicy: Always, what runs
              # tonight is whatever was pushed last, and rolling back means
              # retagging rather than naming a known-good build. Pin to
              # :${GITHUB_SHA} once the build workflow exists.
              image: ghcr.io/ridopark/lag-equity-matrix-ai:latest
              imagePullPolicy: Always
              # Overrides the image's CMD (which serves the web UI). main()
              # no longer resolves as_of up front -- node_comovement resolves it
              # after node_long_bars has extended the file (PHASE-4), so there
              # is no date to compute in the manifest.
              command: ["python", "scripts/daily_ingest.py"]
              envFrom:
                - secretRef: {name: alpaca-credentials}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              # Measured on 2026-09-09, not estimated. The two candidate peaks:
              #   fetch_daily_bars.py   799 MiB  (reads all 4.7M rows even when
              #                                   there is nothing new to add)
              #   comovement node     1,018 MiB  (COMOVE_CLOSES 644 MiB, then
              #                                   comovement_edges on top)
              # LangGraph runs the bars and news chains in one superstep, and a
              # subprocess's memory is charged to this pod's cgroup, so the
              # limit must cover concurrent peaks, not the largest single one.
              # 2Gi sits above the measured 1,018 MiB with room for an
              # overlapping load_vectors.py, which is the one contributor still
              # unmeasured. The deploy plan specified 1.5Gi assuming a windowed
              # COMOVE_CLOSES that was never built -- that would have been tight
              # enough to OOM on the comovement node alone.
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits:   {cpu: "1", memory: 2Gi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: tmp, mountPath: /tmp}
                # daily_ingest.py reaches ArangoDB through `import serve`, which
                # reads this exact path. Mounted as a file so no code changes.
                - name: arango-pw
                  mountPath: /home/appuser/.lagmatrix-arango-pw
                  subPath: password
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: lagmatrix-data}
            - name: tmp
              emptyDir: {}
            - name: arango-pw
              secret:
                secretName: arangodb-auth
                items: [{key: password, path: password}]
                defaultMode: 0400
