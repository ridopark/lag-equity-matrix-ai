# The nightly ingest. Until this exists, daily_ingest.py runs only when a human
# types the command (Q-50).
#
# The graph is one ordered chain (D-115), and every node's inputs are either
# produced by an earlier node or fetched from outside:
#
#   extract_fires  postgres            -> data/fires.csv
#   bars           fires.csv + Alpaca  -> data/bars.parquet
#   long_bars      bars-10y.parquet    -> extends it   <- THE ONE SEEDED FILE
#   comovement     bars-10y.parquet    -> ArangoDB edges
#   news           bars.parquet        -> postgres
#   vectors        fires.csv + postgres-> ArangoDB embeddings
#
# `long_bars` is the only node that cannot start from nothing:
# fetch_daily_bars.py extends the long file and exits "seed it with
# fetch_history.py first" on an empty volume. That is deliberate (D-112) --
# a nightly 10-year, 2,183-symbol refetch is unaffordable. So the PVC is seeded
# once, out of band, with data/bars-10y.parquet. Everything else regenerates.
#
# Two earlier blockers are gone. The scripts reached postgres through
# `kubectl exec`, which no pod can do (Q-54); they now connect directly with a
# role scoped to the lagmatrix schema. And `news` used to read bars.parquet in
# the same superstep that `bars` wrote it, so on an empty volume it failed and
# retried three times where its dependency could not yet exist; the chain
# orders them (D-115).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: lagmatrix-ingest
  namespace: lagmatrix
spec:
  # 09:00 UTC, Tue-Sat: the US session closes 20:00-21:00 UTC, so this leaves
  # margin for Alpaca's EOD bars to finalise and lands 04:00 ET, well before the
  # next open. Tue-Sat covers every Mon-Fri session exactly once.
  #
  # `timeZone` IS LOAD-BEARING. An unset timeZone is interpreted in the
  # controller-manager's local zone, and this node is America/Chicago -- so
  # "0 9" fired at 14:00 UTC, verified by status.lastScheduleTime
  # 2026-09-10T14:00:00Z. That is 10:00 ET, THIRTY MINUTES AFTER THE US OPEN, so
  # the job ran mid-session and fetch_bars.py (`end = min(..., now)`, a
  # timestamp) would write a PARTIAL current-day bar into bars.parquet. That
  # partial bar then satisfies node_bars' own skip predicate and freezes it,
  # while load_news ranks liquidity off it. fetch_daily_bars.py is unaffected:
  # it bounds on midnight UTC. Unset, it would also have shifted an hour when
  # DST ended on 1 November.
  schedule: "0 9 * * 2-6"
  timeZone: "UTC"
  # A re-run must never race the previous one against the same parquet files.
  # D-97 makes concurrent upserts safe but not free, and Forbid is simpler than
  # reasoning about interleaved ones.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 20
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          # A stable label so a NetworkPolicy podSelector can target these pods.
          # Without it they carry only auto-generated batch.kubernetes.io/job-name
          # and controller-uid labels, which change every run -- so a default-deny
          # egress policy would select them while no allow could match, and the
          # nightly ingest would go from working to fully blocked, unattended.
          labels: {app: lagmatrix-ingest}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            # Without fsGroup, Kubernetes owns secret volumes as root:root, so a
            # 0400 mount is unreadable by uid 10001 and arango_db() fails with
            # PermissionError. fsGroup makes volume files group-owned by 10001,
            # which 0440 below then makes readable. This cost a failed run.
            fsGroup: 10001
          initContainers:
            # The PVC mounts at /app/data and shadows whatever the image baked
            # there -- so data/excluded-etfs.csv, which IS committed and IS in
            # the image, was invisible and comovement died on it. This copies
            # the image's copy onto the volume before the run, which keeps the
            # repo as the source of truth rather than letting a seeded copy
            # drift. It mounts the volume at /seed precisely so /app/data stays
            # unshadowed here and the baked-in file can be read.
            - name: seed-reference-data
              image: ghcr.io/ridopark/lag-equity-matrix-ai:66b11a5
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "cp -f /app/data/excluded-etfs.csv /seed/excluded-etfs.csv"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /seed}
          containers:
            - name: ingest
              # Pinned to a SHA, not :latest. With :latest and imagePullPolicy:
              # Always, what runs tonight is whatever was pushed last, and
              # rolling back means retagging rather than naming a known-good
              # build. This tag is the commit the image was built from.
              image: ghcr.io/ridopark/lag-equity-matrix-ai:66b11a5
              imagePullPolicy: IfNotPresent
              # Overrides the image's CMD (which serves the web UI). main()
              # no longer resolves as_of up front -- node_comovement resolves it
              # after node_long_bars has extended the file (PHASE-4), so there
              # is no date to compute in the manifest.
              command: ["python", "scripts/daily_ingest.py"]
              env:
                # serve.py:94 defaults to http://localhost:19999 -- the SSH
                # tunnel a developer runs, meaningless in a pod. Required, but
                # NOT what broke the first run: that was the unreadable password
                # mount above. arango_db()'s bare `except Exception: return
                # None` reports "ArangoDB not reachable" for a PermissionError
                # on the credential, so the message sent me to fix the address
                # while the database was reachable all along.
                - name: LAGMATRIX_ARANGO_URL
                  value: http://arangodb:8529
              envFrom:
                - secretRef: {name: alpaca-credentials}
                # LAGMATRIX_PG_* -- a role scoped to the lagmatrix schema plus
                # read-only on public.audit_log, denied DELETE, DDL and every
                # other trading table. Deliberately not libpq's PGHOST/PGPASSWORD:
                # those get picked up from an ambient environment silently.
                - secretRef: {name: lagmatrix-pg}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              # Measured on 2026-09-09, not estimated. The two candidate peaks:
              #   fetch_daily_bars.py   799 MiB  (reads all 4.7M rows even when
              #                                   there is nothing new to add)
              #   comovement node     1,018 MiB  (COMOVE_CLOSES 644 MiB, then
              #                                   comovement_edges on top)
              # LangGraph runs the bars and news chains in one superstep, and a
              # subprocess's memory is charged to this pod's cgroup, so the
              # limit must cover concurrent peaks, not the largest single one.
              # 2Gi sits above the measured 1,018 MiB with room for an
              # overlapping load_vectors.py, which is the one contributor still
              # unmeasured. The deploy plan specified 1.5Gi assuming a windowed
              # COMOVE_CLOSES that was never built -- that would have been tight
              # enough to OOM on the comovement node alone.
              resources:
                # The request stays 512Mi deliberately. The kubelet ranks
                # eviction by usage-above-request, so a Burstable pod asking
                # 512Mi and using ~1.3Gi is the first thing evicted when the
                # *node* runs short -- and this node runs real-money trading
                # with ~2.2Gi available. That is the outcome we want: the
                # ingest dies, copytrade does not.
                #
                # The limit is 3Gi because the *cgroup* killing a job that
                # would have finished is a different failure, and `backoffLimit: 0`
                # means an OOMKill loses the whole run with no retry. Measured
                # 2026-09-10: fetch_daily_bars.py peaks at 965 MiB for the full
                # path -- fetch, merge_bars' three copies over 4.7M rows, and
                # to_parquet(zstd, level=6) -- and it runs as a subprocess of
                # daily_ingest.py, charged to this same cgroup while the parent
                # holds pandas, pyarrow and langgraph.
                #
                # That write had never once executed in-cluster: `if len(new)`
                # guarded it out on every run, so every previous memory figure
                # structurally excluded it. Two of my own attempts to measure it
                # also returned +0 new rows and would have been reported as
                # measurements of a path that never ran.
                requests: {cpu: 250m, memory: 512Mi}
                limits:   {cpu: "1", memory: 3Gi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: tmp, mountPath: /tmp}
                # daily_ingest.py reaches ArangoDB through `import serve`, which
                # reads this exact path. Mounted as a file so no code changes.
                - name: arango-pw
                  mountPath: /home/appuser/.lagmatrix-arango-pw
                  subPath: password
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: lagmatrix-data}
            - name: tmp
              emptyDir: {}
            - name: arango-pw
              secret:
                secretName: arangodb-auth
                items: [{key: password, path: password}]
                defaultMode: 0440
