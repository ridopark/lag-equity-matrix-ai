# The nightly ingest. Until this exists, daily_ingest.py runs only when a human
# types the command (Q-50).
#
# The graph is one ordered chain (D-115), and every node's inputs are either
# produced by an earlier node or fetched from outside:
#
#   extract_fires  postgres            -> data/fires.csv
#   bars           fires.csv + Alpaca  -> data/bars.parquet
#   long_bars      bars-10y.parquet    -> extends it   <- THE ONE SEEDED FILE
#   comovement     bars-10y.parquet    -> ArangoDB edges
#   news           bars.parquet        -> postgres
#   vectors        fires.csv + postgres-> ArangoDB embeddings
#
# `long_bars` is the only node that cannot start from nothing:
# fetch_daily_bars.py extends the long file and exits "seed it with
# fetch_history.py first" on an empty volume. That is deliberate (D-112) --
# a nightly 10-year, 2,183-symbol refetch is unaffordable. So the PVC is seeded
# once, out of band, with data/bars-10y.parquet. Everything else regenerates.
#
# Two earlier blockers are gone. The scripts reached postgres through
# `kubectl exec`, which no pod can do (Q-54); they now connect directly with a
# role scoped to the lagmatrix schema. And `news` used to read bars.parquet in
# the same superstep that `bars` wrote it, so on an empty volume it failed and
# retried three times where its dependency could not yet exist; the chain
# orders them (D-115).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: lagmatrix-ingest
  namespace: lagmatrix
spec:
  schedule: "0 9 * * 2-6"
  # A re-run must never race the previous one against the same parquet files.
  # D-97 makes concurrent upserts safe but not free, and Forbid is simpler than
  # reasoning about interleaved ones.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 20
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: ingest
              # Pinned to a SHA, not :latest. With :latest and imagePullPolicy:
              # Always, what runs tonight is whatever was pushed last, and
              # rolling back means retagging rather than naming a known-good
              # build. This tag is the commit the image was built from.
              image: ghcr.io/ridopark/lag-equity-matrix-ai:99845ed
              imagePullPolicy: IfNotPresent
              # Overrides the image's CMD (which serves the web UI). main()
              # no longer resolves as_of up front -- node_comovement resolves it
              # after node_long_bars has extended the file (PHASE-4), so there
              # is no date to compute in the manifest.
              command: ["python", "scripts/daily_ingest.py"]
              envFrom:
                - secretRef: {name: alpaca-credentials}
                # LAGMATRIX_PG_* -- a role scoped to the lagmatrix schema plus
                # read-only on public.audit_log, denied DELETE, DDL and every
                # other trading table. Deliberately not libpq's PGHOST/PGPASSWORD:
                # those get picked up from an ambient environment silently.
                - secretRef: {name: lagmatrix-pg}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              # Measured on 2026-09-09, not estimated. The two candidate peaks:
              #   fetch_daily_bars.py   799 MiB  (reads all 4.7M rows even when
              #                                   there is nothing new to add)
              #   comovement node     1,018 MiB  (COMOVE_CLOSES 644 MiB, then
              #                                   comovement_edges on top)
              # LangGraph runs the bars and news chains in one superstep, and a
              # subprocess's memory is charged to this pod's cgroup, so the
              # limit must cover concurrent peaks, not the largest single one.
              # 2Gi sits above the measured 1,018 MiB with room for an
              # overlapping load_vectors.py, which is the one contributor still
              # unmeasured. The deploy plan specified 1.5Gi assuming a windowed
              # COMOVE_CLOSES that was never built -- that would have been tight
              # enough to OOM on the comovement node alone.
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits:   {cpu: "1", memory: 2Gi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: tmp, mountPath: /tmp}
                # daily_ingest.py reaches ArangoDB through `import serve`, which
                # reads this exact path. Mounted as a file so no code changes.
                - name: arango-pw
                  mountPath: /home/appuser/.lagmatrix-arango-pw
                  subPath: password
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: lagmatrix-data}
            - name: tmp
              emptyDir: {}
            - name: arango-pw
              secret:
                secretName: arangodb-auth
                items: [{key: password, path: password}]
                defaultMode: 0400
