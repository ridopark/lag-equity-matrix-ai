# Template only. Fill in and apply out-of-band; never commit the filled copy.
#
# `arangodb-auth` is deliberately NOT templated here -- it already exists in
# the cluster and holds the ArangoDB root password. Recreating it from a
# template risks overwriting a live credential with a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials
  namespace: lagmatrix
type: Opaque
stringData:
  # Read directly from os.environ by scripts/fetch_bars.py, fetch_daily_bars.py
  # and load_news.py -- these exact names, not via a settings object.
  ALPACA_API_KEY: "REPLACE_ME"
  ALPACA_SECRET_KEY: "REPLACE_ME"
---
# Created out-of-band by the role-provisioning step, not by CI. The password is
# generated once and never printed; the role's grants are the security boundary,
# not the secrecy of this file's shape.
apiVersion: v1
kind: Secret
metadata:
  name: lagmatrix-pg
  namespace: lagmatrix
type: Opaque
stringData:
  LAGMATRIX_PG_HOST: postgres.copytrade.svc.cluster.local
  LAGMATRIX_PG_PORT: "5432"
  LAGMATRIX_PG_DATABASE: orchestrator
  LAGMATRIX_PG_USER: lagmatrix_ingest
  LAGMATRIX_PG_PASSWORD: "REPLACE_ME"
---
# The key name carries the `LAGMATRIX_` prefix deliberately. `Settings` sets
# `env_prefix="LAGMATRIX_"`, so `build_analyst_client` reads
# `LAGMATRIX_ANTHROPIC_API_KEY` and a bare `ANTHROPIC_API_KEY` would mount
# perfectly and be silently ignored -- a secret that looks wired and does
# nothing. This follows `lagmatrix-pg`'s prefixed convention, not
# `alpaca-credentials`' bare-name one (those names are read straight from
# os.environ by the fetch scripts, not through Settings).
#
# Both consumers reference this with `optional: true`, so a cluster without
# it still starts: the ingest and the web pod degrade to `status="not_run"`
# analyst notes, the same way they already degrade without ArangoDB. Without
# `optional`, adding this reference before the secret exists would leave both
# pods in CreateContainerConfigError -- taking down a working deployment to
# add a credential nothing can use yet.
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-credentials
  namespace: lagmatrix
type: Opaque
stringData:
  LAGMATRIX_ANTHROPIC_API_KEY: "REPLACE_ME"
