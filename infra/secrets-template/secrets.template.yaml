# Template only. Fill in and apply out-of-band; never commit the filled copy.
#
# `arangodb-auth` is deliberately NOT templated here -- it already exists in
# the cluster and holds the ArangoDB root password. Recreating it from a
# template risks overwriting a live credential with a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials
  namespace: lagmatrix
type: Opaque
stringData:
  # Read directly from os.environ by scripts/fetch_bars.py, fetch_daily_bars.py
  # and load_news.py -- these exact names, not via a settings object.
  ALPACA_API_KEY: "REPLACE_ME"
  ALPACA_SECRET_KEY: "REPLACE_ME"
---
# Created out-of-band by the role-provisioning step, not by CI. The password is
# generated once and never printed; the role's grants are the security boundary,
# not the secrecy of this file's shape.
apiVersion: v1
kind: Secret
metadata:
  name: lagmatrix-pg
  namespace: lagmatrix
type: Opaque
stringData:
  LAGMATRIX_PG_HOST: postgres.copytrade.svc.cluster.local
  LAGMATRIX_PG_PORT: "5432"
  LAGMATRIX_PG_DATABASE: orchestrator
  LAGMATRIX_PG_USER: lagmatrix_ingest
  LAGMATRIX_PG_PASSWORD: "REPLACE_ME"
